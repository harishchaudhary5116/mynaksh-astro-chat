services:
  neo4j:
    image: neo4j:5.26
    container_name: mynaksh-neo4j
    ports:
      - "7474:7474"   # browser  -> http://localhost:7474
      - "7687:7687"   # bolt     -> used by the app
    environment:
      NEO4J_AUTH: neo4j/mynaksh123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "mynaksh123", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
